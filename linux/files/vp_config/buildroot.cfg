system.config = ${cfg}
system.quantum = 100us

system.throttle.rtf = 1

system.addr_simdev   = 0x00100000..0x00100fff
system.cpu.addr_plic = 0x0c000000..0x0fffffff
system.addr_uart0    = 0x10000000..0x10000fff
system.addr_hwrng    = 0x10001000..0x10001fff
system.addr_virtio0  = 0x14000000..0x14000fff
system.addr_ram      = 0x80000000..0xffffffff

system.cpu.dma      = ${system.addr_ram}
system.cpu.sbi_boot = true
for i : ${system.cpu.nharts} do
    system.cpu.hart${i}.pc  = 0x80000000
    system.cpu.hart${i}.x10 = ${i}
done

system.ram.images = ${dir}/fw_jump.bin@0x00000000 \
                    ${dir}/vmlinux.bin@0x00200000 \
                    ${dir}/ror-vp-x${system.cpu.nharts}.dtb@0x02200000

system.virtio_blk.image    = ${dir}/rootfs.ext4
system.virtio_blk.readonly = false

system.term0.backends = tui
