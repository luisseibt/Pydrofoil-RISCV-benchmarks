### vcml-pydrofoil configuration for the buildroot Linux image.

system.name   = pydrofoil-buildroot-linux
system.config = ${cfg}

system.throttle.rtf = 0

system.quantum    = 100us
system.clk_cpu.hz = 1000000000 # 1 GHz

system.core.arch_name = "rv64"
system.core.verbose   = false
system.core.trace     = 0

### Physical address map #####################################################
# Must agree with files/dt/pydrofoil-vp.dts.
system.addr_simdev   = 0x00100000..0x00100fff
system.addr_plic     = 0x0c000000..0x0fffffff
system.addr_uart8250 = 0x10000000..0x10000fff
system.addr_hwrng    = 0x10001000..0x10001fff
system.addr_virtio0  = 0x14000000..0x14000fff

# 512 MiB, matching memory@80000000 in the device tree. system.ram is the
# range while system.sram is the memory module that occupies it.
system.ram = 0x80000000..0x9fffffff

### Interrupt map ############################################################
system.irq_uart8250 = 1
system.irq_virtio0  = 12

### HTIF #####################################################################
# This is sometimes used by the tested sw to communicate with the simulator
# when the simulator has no peripherals (pure ISS)
system.core.htif_tohost = 0x00003000

### Boot #####################################################################
# pc = OpenSBI entry
# a0 = hart ID
# a1 = physical address of the DTB
system.core.pc = 0x80000000
system.core.a0 = 0x0
system.core.a1 = 0x82200000

system.core.symbols = ${dir}/vmlinux.elf

# Offsets are relative to the base of the RAM module, i.e. 0x80000000.
system.sram.images = ${dir}/opensbi_fw_jump.bin@0x00000000 \
                     ${dir}/vmlinux.bin@0x00200000 \
                     ${dir}/pydrofoil-vp-x1.dtb@0x02200000

### Peripherals ##############################################################
system.virtio_blk.image    = ${dir}/rootfs.ext4
system.virtio_blk.readonly = false

system.term8250.backends = tui
system.term.backends     = null
